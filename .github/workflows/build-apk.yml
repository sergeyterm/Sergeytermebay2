name: Build and test Vegas Video
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install official Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test editing logic
        run: bash tools/run-logic-tests.sh
      - name: Build and verify APK
        run: bash tools/build-sdk.sh
      - name: Prepare synthetic media fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash tools/make-test-fixture.sh
      - name: Build Android integration tests
        run: bash tools/build-device-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vegas_Video_2.3_CI_APKs
          path: |
            build/sdk/Sony_Vegas_Video_v2.3.apk
            build/device-tests/VegasVideo_device_tests.apk
          if-no-files-found: error
  android-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Vegas_Video_2.3_CI_APKs
          path: build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android_test_results
          path: build/device-test-results.txt
          if-no-files-found: ignore
