name: Build and test Vegas Video
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: vegas-video-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install official Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test editing logic
        run: bash tools/run-logic-tests.sh
      - name: Prepare synthetic media fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash tools/make-test-fixture.sh
      - name: Build and verify APK
        run: bash tools/build-sdk.sh
      - name: Build Android integration tests
        run: bash tools/build-device-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vegas_Video_2.5_CI_APKs
          path: |
            build/sdk/Sony_Vegas_Video_v2.5.apk
            build/device-tests/VegasVideo_device_tests.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android_build_diagnostics
          path: |
            app/build/reports
            build/reports
          if-no-files-found: ignore
  android-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: default
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Vegas_Video_2.5_CI_APKs
          path: build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android_${{ matrix.api }}_test_results
          path: build/device-test-results
          if-no-files-found: warn
