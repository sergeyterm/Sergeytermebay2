name: "PhotoAvatar — Runway Dev secret presence"
on:
  push:
    branches:
      - photoavatar-ru-android
    paths:
      - ".github/workflows/photoavatar-runway-secret-presence.yml"
  workflow_dispatch:
permissions: {}
jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
      RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
      RUNWAYML_API_KEY: ${{ secrets.RUNWAYML_API_KEY }}
    steps:
      - name: Report whether keys are configured, never print values
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Runway Dev secret configuration"
            for name in RUNWAYML_API_SECRET RUNWAY_API_KEY RUNWAYML_API_KEY; do
              if [[ -n "${!name:-}" ]]; then
                echo "- ${name}: configured"
              else
                echo "- ${name}: not configured"
              fi
            done
            echo ""
            echo "This checks repository-level Actions secrets only. It does not reveal key values or access your Runway Dev account."
          } >> "$GITHUB_STEP_SUMMARY"
