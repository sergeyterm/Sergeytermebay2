name: "PhotoAvatar RU Android APK"
on:
  push:
    branches:
      - photoavatar-ru-android
    paths:
      - "photoavatar-ru-android/**"
      - ".github/workflows/photoavatar-ru.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK Platform 35
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Setup Node 22 for Runway WebRTC bundle
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official Runway browser SDK
        working-directory: photoavatar-ru-android/frontend
        run: npm install --no-audit --no-fund
      - name: Bundle Runway video client
        working-directory: photoavatar-ru-android/frontend
        run: npm run build
      - name: Check source and API contracts
        working-directory: photoavatar-ru-android
        run: python3 -m unittest discover -s tests -p "test_*contract.py" -v
      - name: Setup Python 3.12 for browser UI tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Browser UI test with simulated Runway error
        working-directory: photoavatar-ru-android
        run: python tests/test_call_ui_browser.py
      - name: Upload video call UI screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-1.4.1-whatsapp-style-call-screenshots
          path: photoavatar-ru-android/ui-whatsapp-call-error-*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Build Android APKs (debug and unsigned release)
        working-directory: photoavatar-ru-android
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Android Lint
        continue-on-error: true
        working-directory: photoavatar-ru-android
        run: gradle :app:lintDebug --no-daemon
      - name: Upload APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-Android-1.4.1-debug
          path: photoavatar-ru-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload unsigned APK for private key injection
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-Android-1.4.1-unsigned
          path: photoavatar-ru-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
          if-no-files-found: error
      - name: Bundle Android signing utilities
        shell: bash
        run: |
          set -e
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
      - name: Upload signing utilities for post-build local signing
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-Android-build-tools-35
          path: signing-tools/
          retention-days: 14
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: PhotoAvatarRU-Android-1.4.1-debug
          path: smoke-apk
      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35 and launch PhotoAvatar RU
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash photoavatar-ru-android/tools/emulator-smoke.sh
      - name: Upload Android startup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-Android-Emulator-API35-smoke
          path: |
            launch.txt
            pid.txt
            app-launch.png
            crash-log.txt
            window.xml
            full-logcat.txt
            webview-provider.txt
          if-no-files-found: warn
          retention-days: 14
