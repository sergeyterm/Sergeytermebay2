name: "PhotoAvatar RU Android APK"
on:
  push:
    branches:
      - photoavatar-ru-android
    paths:
      - "photoavatar-ru-android/**"
      - ".github/workflows/photoavatar-ru.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK Platform 35
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Check source and API contracts
        working-directory: photoavatar-ru-android
        run: python3 -m unittest discover -s tests -p test_contract.py -v
      - name: Build Android debug APK
        working-directory: photoavatar-ru-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Android Lint
        continue-on-error: true
        working-directory: photoavatar-ru-android
        run: gradle :app:lintDebug --no-daemon
      - name: Upload APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-Android-1.2.0-debug
          path: photoavatar-ru-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: PhotoAvatarRU-Android-1.2.0-debug
          path: smoke-apk
      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 35 and launch PhotoAvatar RU
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            test -f smoke-apk/app-debug.apk
            adb install -r smoke-apk/app-debug.apk
            adb logcat -c
            sleep 6
            adb shell am start -W -n ru.photoavatarru.app/.MainActivity | tee launch.txt
            grep -q 'Status: ok' launch.txt
            sleep 5
            adb shell pidof ru.photoavatarru.app | tee pid.txt
            test -s pid.txt
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml
            grep -q 'Разговор лицом к лицу' window.xml
            adb exec-out screencap -p > app-launch.png
            adb logcat -d -b crash -v brief > crash-log.txt
            if grep -E 'FATAL EXCEPTION|Process: ru.photoavatarru.app' crash-log.txt; then exit 1; fi
      - name: Upload Android startup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-Android-Emulator-API35-smoke
          path: |
            launch.txt
            pid.txt
            app-launch.png
            crash-log.txt
            window.xml
          if-no-files-found: warn
          retention-days: 14
