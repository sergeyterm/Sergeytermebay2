name: "PhotoAvatar RU Android APK"
on:
  push:
    branches:
      - photoavatar-ru-android
    paths:
      - "photoavatar-ru-android/**"
      - ".github/workflows/photoavatar-ru.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android command-line SDK
        uses: android-actions/setup-android@v3
      - name: Install API 35 platform and tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Check source and API contracts
        working-directory: photoavatar-ru-android
        run: python3 -m unittest discover -s tests -p test_contract.py -v
      - name: Build Android debug APK
        working-directory: photoavatar-ru-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Android Lint
        continue-on-error: true
        working-directory: photoavatar-ru-android
        run: gradle :app:lintDebug --no-daemon
      - name: Upload APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAvatarRU-Android-1.2.0-debug
          path: photoavatar-ru-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
