plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.photoavatarru.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.photoavatarru.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.3.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
