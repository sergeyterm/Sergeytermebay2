plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.photoavatarru.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.photoavatarru.app'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.6.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Bundled on-device face detection: works without network or Play Services download.
    implementation 'com.google.mlkit:face-detection:16.1.7'
    // Android's HttpURLConnection does not support PATCH; use OkHttp for avatar updates.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
