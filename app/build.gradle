plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.sonyvegasvideo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.personal.sonyvegasvideo'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '2.3'
        testInstrumentationRunner 'com.personal.sonyvegasvideo.ExportInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('signing/vegas-debug.keystore').exists() ? rootProject.file('signing/vegas-debug.keystore') : file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
