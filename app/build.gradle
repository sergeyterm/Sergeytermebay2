plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.sonyvegasvideo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.personal.sonyvegasvideo'
        minSdk 29
        targetSdk 35
        versionCode 11
        versionName '2.7.1'
        testInstrumentationRunner 'com.personal.sonyvegasvideo.ExportInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (rootProject.file('signing/vegas-debug.keystore').exists()) {
            personal {
                storeFile rootProject.file('signing/vegas-debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (rootProject.file('signing/vegas-debug.keystore').exists()) {
                signingConfig signingConfigs.personal
            }
        }
        release {
            minifyEnabled false
        }
    }
    testOptions { animationsDisabled true }
}

dependencies {
    implementation 'androidx.media3:media3-common:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-transformer:1.11.1'
}
